# Server Configuration
server.port=8085

# Application Name
spring.application.name=spring-boot-devops-cicd

# MySQL Database Connection Configuration
# Uses environment variables with secure defaults pointing to the Docker network container hostname
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-container:3306/devops_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:devops_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:DevopsSecure@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Actuator / Health Endpoints (Optional but good for DevOps liveness/readiness probes)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
